id: resource-semantic-naming
title: 资源必须按使用场景命名，不能沿用来源编号
description: |
  Lanhu 导出的资源叫 img_0/img_1/img_2，skill 要求按 <screen>_<region>_<role>
  语义命名后再接入工程。本用例要求 Agent 产出结构化的资源映射，再由脚本核对命名。

  素材是真实图片文件（尺寸三者不同），因此 Agent 能实测像素尺寸、逐个推导 scale，
  而不是只能对着文件名写空话。

input:
  prompt: |
    这个 Lanhu 页面导出了三个图片资源（就在工作目录下），要接入 iOS 工程：

    - img_0.png：顶部主视觉拼图
    - img_1.png：右上角关闭图标
    - img_2.png：底部订阅卡片背景

    页面叫 plan-selection。请给出接入方案，并把资源映射写进 resource-policy.json，
    我要拿它去做评审。

    这一轮只要方案和 resource-policy.json，不用建 run 目录、不用写生产代码。

# 本用例只判 resource-policy.json 的内容，因此显式收窄范围；排练时不收窄的话
# Agent 会把整个 .ihereforUI 目录树连同 plans/、integration/ 一起铺出来。

# 把三张图随工作区下发，用例不依赖 Agent 的当前目录。
# 只拷 workspace/ 这一层：fixture 根目录的 README.md 写着三张图的实测像素尺寸与
# 「尺寸刻意各不相同」这条提示，而「自己量出尺寸再推导 scale」正是本用例要考的动作。
context:
  repo_fixture: evals/fixtures/assets/workspace

expect:
  files_exist:
    - "resource-policy.json"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-resource-policy.sh
  timeout_seconds: 30
