id: reference-must-share-device-canvas
title: 基准截图必须与设备截图同源
description: |
  基准图与目标 App 截图必须使用同一个画布坐标系，否则像素差异没有证据效力。
  本用例给出运行时设备尺寸，要求 Agent 用设备尺寸渲染基准，而不是沿用画布或
  某个常见机型的固定尺寸。

input:
  prompt: |
    目标设备是 iPhone 17 模拟器，运行时从 API 读到屏幕是 402x874 点，截图是 3 倍图。

    现在我要给 Lanhu 导出的 index.html 生成视觉基准截图，请问命令怎么写？
    顺便说明一下为什么这么取参数，以及基准图跟设备截图之间需要满足什么关系。

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["render_reference.mjs", "--viewport-from", "runtime-device.json"]
        any: ["1206", "2622", "402x874"]
    - output_matches:
        any: ["(?i)同源", "(?i)same\\s+canvas", "(?i)像素尺寸.{0,12}一致"]
