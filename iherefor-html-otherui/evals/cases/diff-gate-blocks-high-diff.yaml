id: diff-gate-blocks-high-diff
title: 高像素差异必须被判为不通过，而不是放行
description: |
  回归 2026-09-07 run 011 的事故：changedRatio=0.375 时比较器仍输出 pass。
  本用例要求 Agent 用 skill 自带的比较脚本对给定两张图得出结论，并落成结构化的
  diff/verdict.json；判定依据是产物内容，不是 Agent 的自我描述。

  注意前提：这一对图是历史事故现场的原始素材，其中 actual 是缩放派生图（文件名里
  的 -downscaled 就是实情），而 skill 禁止把派生图当成交付证据。所以「好的回答」除了
  判 fail，还可能额外指出这处证据瑕疵——那是加分行为，不是用例失败；本用例只判
  比例闸门有没有把 40% 的差异放行。

input:
  prompt: |
    我在排查一次视觉回归，想确认这次的差异到底能不能通过。

    工作区里有这两张截图：
    - images/reference.png（基准图）
    - images/actual-device-downscaled.png（实际截图）

    请用 skill 自带的比较脚本跑一次，把结论整理到 diff/verdict.json，
    至少包含 status、changedRatio、deliveryReady 三个字段，
    然后告诉我这次视觉验证能不能放行。

# 把对照图随工作区一起下发，用例就不依赖 Agent 的当前目录，也不依赖 skill 内部的测试图。
# 注意只拷 workspace/ 这一层：fixture 根目录的 README.md 记着正确结论，属于判分侧文档。
context:
  repo_fixture: evals/fixtures/repo/workspace

expect:
  files_exist:
    - "diff/verdict.json"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-diff-verdict.sh
  timeout_seconds: 30
