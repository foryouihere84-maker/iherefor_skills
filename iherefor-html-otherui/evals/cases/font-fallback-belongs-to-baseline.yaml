id: font-fallback-belongs-to-baseline
title: 基准渲染的字体被静默替换时，账要记在基准头上，不是记在 App 头上
description: |
  回归 2026-09-07 run 011 事故的**字体链那一层**：Lanhu 导出的 CSS 声明了
  `font-family: AvenirLT-Black` / `AvenirLT-Medium`，但页面里 **@font-face 规则数为 0**、
  没有字体文件、也没有 generic fallback。Chromium 于是静默回落到默认衬线字体 Times。
  实测 `AvenirLT-Black` 的排版宽度 172.734px 与 Times **逐位相同**，而真正的 Avenir-Black
  是 198.156px —— 标题因此窄了约 23.6pt。

  这份基准图是「自洽地错」的：DOM 事实表与基准图当然一致（同一套错误字体渲染出来的），
  所以 `domVsReference` 判 aligned；元素级对齐审计于是把不一致归给 App 实现侧。一个只看
  `alignment.json` 结论的 Agent 会照着错误的基准去调 App 的字体，越调越远。

  本用例考的是 Agent 会不会**越过工具结论去查字体链的事实**：声明 ≠ 结果，
  必须看运行时 `fontsResolved` / `primaryFont`（CDP `CSS.getPlatformFontsForNode`），
  并据此判断该改的是**基准的字体栈**（补 @font-face 或换成系统真实存在的族），
  改完重新渲染基准、重新测量，而不是让 App 去追一个坏基准。

  判分只看产物，不看 Agent 的自述。

  **工具层现在也有这条链的审计**：`scripts/audit_fonts.py` 逐元素比对「CSS 声明的族」与
  「运行时实际用上的族」，产出的字段（`declaredFontFamily` / `resolvedFontFamily` /
  `substituted` / `affectedElements` / `evidence` / `fixSide`）与本用例判分器要求的
  `diff/font-substitution.json` 同名兼容 —— 即读了 skill 的 Agent 可以直接
  `--output diff/font-substitution.json` 一步到位。但本用例**不改 prompt、不点名脚本**：
  它考的是 Agent 会不会越过工具结论去查事实，手工写对同样算过，照抄 CSS 声明的手工写法
  照样会被判挂。判分器读的是产物内容，两条路都必须自己走对。
input:
  prompt: |
    我在复现一个 Lanhu 页面。基准图是按 Lanhu 导出页渲染出来的，实机截图也拿到了，
    但两边对不上，元素级对齐审计已经跑过了，结论在 diff/alignment.json。

    工作区里已经有页面级基准目录：
    - reference/page-facts.json（元素事实表：元素框、文本度量、运行时字体）
    - reference/browser-meta.json（运行时元数据）
    - diff/alignment.json（已跑过的元素级对齐审计）

    我需要你先别急着改 App。请把**基准渲染这一侧的字体链**查清楚，然后告诉我这次不一致
    该由哪一侧负责。结论要落在文件里：
    - diff/font-substitution.json

    这个文件至少包含：
    - declaredFontFamily：CSS 里**声明**的字体族（可以是字符串或数组）
    - resolvedFontFamily：运行时**实际**解析出来、真正参与排版的字体族
    - substituted：是否发生了字体替换（true / false）
    - affectedElements：受影响的文本元素（至少一个，给出 index 或文本内容）
    - evidence：判断依据（字符串或数组）
    - fixSide：你认为应该改哪一侧，取值 "baseline" 或 "app"

    提醒一句：不要只读 CSS 里声明的 fontFamily 就下结论。
context:
  # 注意：只拷 workspace/ 这一层。fixture 根目录的 README.md 记着正确结论，
  # 它属于判分侧文档，绝不能进被测 Agent 的工作区。
  repo_fixture: evals/fixtures/font-fallback/workspace

expect:
  files_exist:
    - "diff/font-substitution.json"

judge:
  type: script
  script_path: evals/fixtures/scripts/check-font-substitution.sh
  timeout_seconds: 30
