id: layout-no-device-derived-coordinates
title: 布局不得照抄探针设备上的量取值；尺寸要写清由什么闭合，位置要相对直接父视图
description: |
  回归本 skill 最重要的一条硬约束。设计稿只有一个尺寸（Lanhu 画布 393x852），
  实机是 402x874。把设计稿量出来的值直接当绝对坐标写进约束，就把它钉死在探针设备上了 ——
  换台设备就是错的，而它「有出处、算过」，比一眼可疑的魔数更难发现。

  素材是一个已经「通过」自检的 iOS 实现：`implementation` 闸门记 pass、
  `deliveryReady` 记 true。源码里 `CGRectMake(0, 0, 393, 321)`、
  `SpecialOfferOffersLocalRect(23, 495, 347, 68)`、`CGRectMake(25, 741, 352, 48)`
  全是绝对 frame，一处比例原语都没有。

  **本用例同时考召回与精度，而闭合契约让精度这一侧换了判据。** 计划声明的关系里：

  - `hero.height`、`offers.y`、`cta.y`、`legal.x/y` 是 `proportional` —— 源码里的
    `321 / 495 / 741 / 83 / 801` 就是只在这台设备上成立的铁证，必须被点名；
  - `offers.height = 68`、`cta.height = 48` 被生成端推成 **`fixed` 候选**（带
    `needsReview`）—— 闭合契约下 `fixed` 不是默认值，Agent 必须逐条复核并把结论
    写进 `reviewPending`，但**不能把它们报成违规**：它们的问题是「闭合方式待定」，
    不是「这个值不该出现」；
  - `offers.x = 23`、`cta.x = 25` 是**第一层子视图的水平位置**，`forced-proportional`
    （应按页面宽度比例写），但 `≤48pt` 落待判；
  - 圆角 12、发丝线 1、最小点击区 44 是设计常量。

  这三类都是**报出来才是错**的一侧。旧口径靠「尺寸是常量」一句话把它们打包豁免，
  新契约没有这句话了 —— 豁免理由必须逐类说清（设计常量 / 闭合方式待复核 / 待判），
  所以本用例同时验证 Agent 没有退回两侧极端：既不是「凡数字皆违规」，也不是
  「凡数字皆豁免」。

  契约之外，本页还叠加一层**第一层子视图**规则：offers / cta / hero / legal 直接挂在
  page 下（`parentIndex == page`），是第一层子视图。它们的位置按**页面比例**重排
  （水平 `x = page.width × ratio`、垂直 `y = page.height × ratio`），写死也是错 ——
  不同的是 `offers.x = 23`、`cta.x = 25` 因为 `≤48pt`，检查端无法与设计常量自动区分，
  落 `ambiguousLiterals` 待人工判断，**不判成硬违规**；而 `>48pt` 的
  `321 / 495 / 741 / 83 / 801` 才是硬违规。这两档要分开：漏掉大数值是漏报，
  把 23/25 判成硬违规、或把 68/48 这类 fixed 候选报成违规，都是误报。

  判分只看产物，不看 Agent 的自述。
input:
  prompt: |
    这个 run 自己记的是已交付：`delivery-gate.json` 里 implementation=pass、
    deliveryReady=true。

    但我怀疑它的布局有问题。这个页面的设计稿是 393x852，实机是 402x874。
    请核对：**布局有没有把只在探针设备上成立的量取值直接写进代码？**

    本 skill 现在的契约是**闭合契约**：设计稿给的 `width`/`height` 是参考事实，
    **不等于**生产约束 —— 每条尺寸都要写清「由什么闭合」（`fixed` / `intrinsic` /
    `bounded` / `aspect-ratio`），每条位置都要相对**直接父视图**用约束表达
    （贴边写约束常量、成比例写 multiplier、居中写对齐锚点），而不是把某一台设备上
    量出来的绝对坐标抄进代码。

    工作区里有：
    - reference/page-facts.json —— 页面事实表（元素位置与父子层级）
    - src/SpecialOfferViewController.m —— 本次的 iOS 实现
    - delivery-gate.json —— 该 run 的交付闸门

    请用 skill 自带的脚本得出证据，并把结论落到文件里，不要只写在回答里：

    - `diff/layout-proportions.json` —— 布局约束校验器的**原始产出**（用 `--output`
      落盘），不要手工总结成段落；
    - `diff/layout-verdict.json`，至少包含：
      - `status`：`"fail"` 或 `"pass"`
      - `deliveryReady`：`true` 或 `false`
      - `violations`：数组，每项至少含 `literal`（数值）与 `file`
      - `reviewPending`：数组，逐条列出生成端标了 `needsReview` 的关系（生成端只给
        候选，判断权在你），每项至少含 `relation` 与一句你复核后的结论
      - `reason`：一句话说明判据

    注意区分这几类数字：
    - 圆角、描边、最小点击区（12 / 1 / 44）—— 设计常量，保持原值不缩放，**不是**违规；
    - 生成端推为 `fixed` 候选的控件尺寸（卡片高 68、按钮高 48）—— 它们的问题是
      **闭合方式待复核**，不是「这个值不该出现」，所以**不是**违规；复核结论写进
      `reviewPending`，不要写进 `violations`；
    - 第一层子视图的水平位置（卡片左起 23、按钮左起 25，这些元素直接挂在 page 下）——
      按契约该按页面宽度比例写，写死也是错，但 ≤48pt 无法与设计常量自动区分，
      落待判（ambiguous），**不是**硬违规；
    - 只在 402x874 上成立的绝对坐标（>48pt，如 321 / 495 / 741 / 83 / 801）——
      换算产物，换台设备即失效，**是**违规。

    不要把源码改掉，只出结论。
context:
  repo_fixture: evals/fixtures/device-derived-layout/workspace
expect:
  files_exist:
    - "diff/layout-proportions.json"
    - "diff/layout-verdict.json"
judge:
  type: script
  script_path: evals/fixtures/scripts/check-layout-proportions.sh
  timeout_seconds: 60
