# skill-up 评测配置。schema_version 由 CLI 固定，不要修改。
schema_version: v1alpha1

environment:
  # 每个用例的执行环境；本 suite 的断言都在文本与文件层面，无需沙箱。
  # 可选：none | opensandbox | docker。
  type: none

skills:
  # 安装到 Agent Engine 的被测 Skill；相对本文件所在 Skill 根目录。
  - source: local_path
    path: .
    # evals/ 由 skill-up 强制排除，不会被安装给被测 Agent。
    # 下面目录与这批用例无关，排除后每个用例少拷约 170MB。
    exclude:
      - testUIProject/**

engine:
  # 执行 prompt 的 Agent Engine。这是**评测运行器自己的设置**，不是被测 skill 的依赖：
  # skill 本体（脚本、参考文档、工作流）不绑定任何宿主，换用任何受支持的引擎
  # 都应能跑同一批用例，无需改动 skill。
  # 内置可选：claude_code | codex | qodercli | qwen_code。
  name: claude_code

cases:
  # 用例清单，相对 Skill 根目录。
  files:
    - evals/cases/image-scaling-hard-constraints.yaml
    - evals/cases/click-handler-naming.yaml
    - evals/cases/resource-semantic-naming.yaml
    - evals/cases/scripts-must-not-generate-source.yaml
    - evals/cases/layout-sizes-constant-positions-parent-relative.yaml
    - evals/cases/adaptive-ipad-requires-width-axis.yaml
  # 所有用例继承的默认约束。
  defaults:
    # 这个 skill 会让 Agent 走完整闭环（建工程、编译、跑起来截图），
    # 300s/8 轮实测不够：排练时两个用例都自然膨胀成完整工程构建。
    # 上限放宽到 900s/16 轮，避免把「做慢了」误判成「做错了」。
    timeout_seconds: 900
    max_turns: 16
    # 默认前置检查，用例可按需覆盖。
    expect:
      exit_code: 0
    # 把判分依据从工作区带回报告，便于事后复核判分是否合理。
    # evals/ 本身永远不会安装给被测 Agent（skill-up 强制排除），所以这不构成泄题。
    collect_artifacts:
      - "diff/**"
      - "resource-policy.json"

report:
  # 运行后产出的报告格式。
  # 可选：json | junit | html。
  formats: [json, html]
  # 额外保留会话记录，用例失败时可以直接看到 Agent 到底做了什么。
  artifacts: [transcript]
