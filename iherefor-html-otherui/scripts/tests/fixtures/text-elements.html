<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>page-facts 文本元素事实 fixture</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 300px; height: 420px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 20px;
    color: #111111; background: #ffffff;
  }
  .abs { position: absolute; left: 10px; }
  /* 自己直接带一个词、又包着另一个文本元素：
     用来验证 textMetrics.rects 只覆盖「本元素排版的文本」，不含后代文本。 */
  .mixed { top: 130px; }
  .child { margin-left: 4px; }
</style>
</head>
<body>
  <!-- 元素顺序是故意的，不要「整理」：中间那个不可见的 <br> 夹在文本元素之间，
       才能暴露「标记用未过滤 DOM 序号、采集用过滤后下标」的错位。
       一旦错位，<br> 之后所有文本元素的字体都会被写到隔壁元素头上。 -->
  <div class="abs" style="top:20px"><span>Restore</span></div>
  <br>
  <div class="abs" style="top:50px"><span>Choose Your Plan</span></div>
  <div class="abs mixed">Label <span class="child">Wrapped Words Here</span></div>
  <div class="abs" style="top:170px"><span>Alpha</span></div>
  <div class="abs" style="top:200px"><span>BetaBeta</span></div>
  <div class="abs" style="top:230px"><span>GammaGammaGamma</span></div>
</body>
</html>
