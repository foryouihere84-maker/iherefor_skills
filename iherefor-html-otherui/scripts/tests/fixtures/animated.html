<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>animation fixture</title>
  <style>
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(120px); } }
    @keyframes fade { from { opacity: 0.2; } to { opacity: 1; } }
    #box { width: 60px; height: 60px; background: #58a6ff; animation: slide 2s linear infinite; }
    #chip { width: 40px; height: 20px; background: #3fb950; animation: fade 3s linear infinite alternate; }
  </style>
</head>
<body>
  <div id="box"></div>
  <div id="chip"></div>
</body>
</html>
