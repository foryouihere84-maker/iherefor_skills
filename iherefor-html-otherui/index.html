<!doctype html>
<html lang="zh-CN" data-page-node-id="VGKxqbZEXsm3cAWavSWFTO">
<head data-page-node-id="Dp1w7PpicaX484khGzEkqC">
<meta charset="utf-8" data-page-node-id="JLduqAQUEB0ILrgZuBFUCm" />
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="rawMRNHbUvGd5ZyCiHORFc" />
<title>Lanhu UI Diff Viewer</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;padding:18px 24px;border-bottom:1px solid var(--line);background:#0d1117eF;backdrop-filter:blur(12px)}
h1{margin:0 0 8px;font-size:22px}p{margin:4px 0;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
button,select,input{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);padding:8px 11px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}
main{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 145px)}aside{border-right:1px solid var(--line);padding:14px;overflow:auto}.count{color:var(--muted);margin:4px 0 12px}.item{padding:11px;border:1px solid transparent;border-radius:8px;cursor:pointer;margin-bottom:6px}.item:hover,.item.active{background:#1f2933;border-color:var(--accent)}.item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{display:block;color:var(--muted);margin-top:4px}.status{float:right;font-size:11px;padding:2px 6px;border-radius:10px;background:#30363d}.status.pass{color:var(--ok)}.status.fail{color:#f85149}.status.review{color:var(--warn)}
section{padding:20px;min-width:0}.empty{display:grid;place-items:center;height:60vh;color:var(--muted);text-align:center}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);margin:5px 0 10px}.note{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 18px;max-width:760px}.note code{background:#30363d;padding:1px 4px;border-radius:4px}.metric{padding:4px 8px;border:1px solid var(--line);border-radius:6px}.previews{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.preview{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}.preview h3{margin:0 0 8px;font-size:14px}.frame{min-height:180px;display:grid;place-items:center;background:#0b0f14;border-radius:6px;overflow:auto}.frame img{display:block;max-width:100%;height:auto;object-fit:contain}.overlay{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px}.overlay h3{margin:0 0 8px}.overlay-frame{position:relative;overflow:auto;max-height:75vh;background:#0b0f14;border-radius:6px}.overlay-frame img{display:block;max-width:100%;height:auto}.overlay-frame img:last-child{position:absolute;inset:0;clip-path:inset(0 0 0 var(--split,50%))}.range{width:100%;margin-top:8px}.json{margin-top:16px}.json pre{max-height:260px;overflow:auto;background:#0b0f14;padding:12px;border-radius:6px;color:#c9d1d9;font-size:12px}
@media(max-width:900px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:280px}.previews{grid-template-columns:1fr}}
</style></head>
<body data-page-node-id="fIJ7dXy0kdKcJDF0JirAD8">
<header data-page-node-id="fRLxrE8iaU43kEjVOQll4o"><h1 data-page-node-id="1sRPjDi8cpaVQxC5OZNPcN">Lanhu UI Diff Viewer</h1><p data-page-node-id="m8WBxYYSrijNxOQ2yLLeMF">递归查看 .ihereforUI 下的差异结果，并同时对比 reference 与 actual。</p><div class="toolbar" data-page-node-id="gt45c1zPTbq9w9WdUJLeOG"><button id="pick" data-page-node-id="k0aPqnJ3lfZiNnjtiL7sCH">选择项目目录（推荐）</button><input id="folderInput" type="file" webkitdirectory directory multiple hidden data-page-node-id="JPEjMdCQoh4gBkhY7PKoHp"><button id="refresh" disabled data-page-node-id="XJGFfAkQQ5vCTyMi1upOEh">重新扫描</button><input id="filter" placeholder="筛选页面或运行 ID" disabled data-page-node-id="SXSikCrW5EkX3XXWt2toKR"><select id="sort" data-page-node-id="wpwfrtpNIMVo6MP8OuOnxy"><option value="desc" data-page-node-id="v9tnQ8VWfT7i3KdTm7GrS4">时间：新 → 旧</option><option value="asc" data-page-node-id="ZNjzwgtHvkMiPakGjjGQwB">时间：旧 → 新</option></select><span id="root" class="count" data-page-node-id="AyuA2LkitNgyy1JC1s2NDo">尚未选择目录</span></div><p data-page-node-id="Tuf2KPDAhYI2qQbETq2tIk">提示：macOS 选择器通常隐藏以 <code data-page-node-id="lO9QhKacoMdjtkL5eDqPtX">.</code> 开头的目录，请选择项目上层目录；隐藏的 <code data-page-node-id="wQ3HwHi61bPgfurjKEzigV">.ihereforUI</code> 会自动递归扫描。</p></header>
<main data-page-node-id="ksSSnmSuQ4GARVr2n97sqp"><aside data-page-node-id="vb7I8OW8sJPBRUkJVXDu5T"><div id="count" class="count" data-page-node-id="RKCmjZH5zMzLoV9Erd0WmJ">请选择目录开始扫描</div><div id="list" data-page-node-id="D01uOnqjXojY8eFsaDu5Gr"></div></aside><section id="detail" data-page-node-id="escIH8b4YjwHrYoDUBXlk4"><div class="empty" data-page-node-id="vG8MEUBcoDCRL3Qx7cGB3g">选择一个包含 <code data-page-node-id="xLWXMdp55xEesnVKNfTxVf">.ihereforUI</code> 的目录<br data-page-node-id="fOzUNFNKaPt36dscLm2nh1">页面会自动递归查找 <code data-page-node-id="gcZYAB5xG35zf2wiE4kuwh">diff/*.json</code></div></section></main>
<script>
let rootHandle=null, files=new Map(), records=[], selected=null, urls=new Map();
const $=id=>document.getElementById(id);
async function walk(dir,prefix=''){for await(const [name,h] of dir.entries()){const path=prefix+name;if(h.kind==='directory')await walk(h,path+'/');else files.set(path,h)}}
function cleanPath(p){return p.replaceAll('\\','/').replace(/^file:\/\//,'').replace(/^\/+/,'')}
function candidatePaths(value,jsonPath){if(!value||typeof value!=='string')return[];let v=cleanPath(value), out=[v];const marker=v.indexOf('.ihereforUI/');if(marker>=0)out.unshift(v.slice(marker+12));out.push(jsonPath.slice(0,jsonPath.lastIndexOf('/')+1)+v);return [...new Set(out)]}
async function asFile(v){return v instanceof File?v:await v.getFile()}
async function text(path){const h=files.get(path);return h?await(await asFile(h)).text():null}
async function imageUrl(value,jsonPath){for(const p of candidatePaths(value,jsonPath)){const h=files.get(p);if(h){if(!urls.has(p))urls.set(p,URL.createObjectURL(await asFile(h)));return urls.get(p)}}const base=cleanPath(value).split('/').pop();for(const [p,h] of files){if(p.endsWith('/'+base)||p===base){if(!urls.has(p))urls.set(p,URL.createObjectURL(await asFile(h)));return urls.get(p)}}return null}
function timeFor(path,data){const m=path.match(/(20\d{6,14})/);if(m){const s=m[1];let iso=s;if(s.length>=8)iso=`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}${s.length>=14?`T${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}`:''}`;const d=Date.parse(iso);if(!Number.isNaN(d))return d}const stamp=data.timestamp||data.createdAt||data.updatedAt;const parsed=stamp?Date.parse(stamp):0;return Number.isNaN(parsed)?0:parsed}
async function scan(){records=[];for(const [path,h] of files){if(!/\/diff\/[^/]+\.json$/i.test('/'+path))continue;try{const data=JSON.parse(await text(path));if(!data.reference&&!data.actual)continue;const st=await asFile(h);records.push({path,data,time:timeFor(path,data),modified:st.lastModified})}catch(e){console.warn('skip',path,e)}}records.sort((a,b)=>b.time-a.time||b.modified-a.modified);renderList();if(!records.length){$('detail').innerHTML='<div class="empty">未找到差异 JSON。请确认选中的是包含 <code>.ihereforUI</code> 的项目目录，且结果位于 <code>.ihereforUI/**/runs/*/diff/*.json</code>。</div>'}}
function renderList(){const q=$('filter').value.toLowerCase();const asc=$('sort').value==='asc';let arr=records.filter(r=>!q||r.path.toLowerCase().includes(q));if(asc)arr=[...arr].reverse();$('count').textContent=`找到 ${arr.length} 条差异记录（共 ${records.length} 条）`;$('list').innerHTML=arr.map((r,i)=>{const d=r.data,s=d.status||'unknown',cls=s==='pass'?'pass':s==='fail'?'fail':'review';return `<div class="item ${selected===r?'active':''}" data-i="${records.indexOf(r)}"><span class="status ${cls}">${s}</span><strong>${r.path.split('/').slice(-3,-2)[0]||'diff'}</strong><small>${r.path}</small><small>${new Date(r.time||r.modified).toLocaleString()}</small></div>`}).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{selected=records[+el.dataset.i];renderList();renderDetail()})}
function sizeText(data){const r=data.referenceSize||{},a=data.actualSize||{};const w=r.width??data.width,h=r.height??data.height;if(w==null&&h==null)return '—';const mismatch=a.width!=null&&a.height!=null&&(a.width!==w||a.height!==h);return `${w??'—'} × ${h??'—'}${mismatch?' ／ 实机 '+a.width+' × '+a.height+'（尺寸不一致，diff 无证据效力）':''}`}
function floorText(data){const f=data.declaredStructuralFloor||{};const v=f.value??data.expectedStructuralFloor;if(v==null)return '';const src=f.source??data.expectedStructuralFloorSource;const w=f.withinFloor;const tag=w===true?' · 界内':w===false?' · 超界':'';const head=f.headroom==null?'':` · 余量 ${Number(f.headroom).toFixed(4)}`;return `<span class="metric">结构下界: ${Number(v).toFixed(4)}${src?' ('+src+')':''}${tag}${head}</span>`}
async function renderDetail(){if(!selected)return;const {path,data}=selected;const ref=await imageUrl(data.reference,path),act=await imageUrl(data.actual,path);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));$('detail').innerHTML=`<h2>${esc(path.split('/').slice(-3,-2)[0]||'差异结果')}</h2><div class="meta"><span class="metric">${esc(data.status||'unknown')}</span><span class="metric">structuralRatio: ${data.structuralRatio==null?'—':Number(data.structuralRatio).toFixed(4)}</span><span class="metric">fillRatio: ${data.fillRatio==null?'—':Number(data.fillRatio).toFixed(4)}</span><span class="metric">textureRatio: ${data.textureRatio==null?'—':Number(data.textureRatio).toFixed(4)}</span><span class="metric">changedRatio: ${data.changedRatio==null?'—':Number(data.changedRatio).toFixed(4)}</span><span class="metric">尺寸: ${sizeText(data)}</span>${floorText(data)}${data.attribution?`<span class="metric">attribution: ${esc(data.attribution.status||'unknown')}</span>`:''}${data.worstRegions&&data.worstRegions.length?`<span class="metric">最差区域: ${data.worstRegions.length}</span>`:''}<span class="metric">${new Date(selected.time||selected.modified).toLocaleString()}</span></div>
<div class="note">判定只看 structuralRatio 与 fillRatio；textureRatio 是栅格化噪点，不参与放行。两类<b>不对称</b>：fillRatio 超限一律 fail；structuralRatio 超限时，若仍在计划声明的 <code>gateReachability.expectedStructuralFloor</code> 内（见上方「结构下界」格，标「界内」即按声明放行）且 fill 未超限，判 pass-with-review —— 文字密集页的字形差有物理下界，不可能降到 0。整页比值里混着已声明为 unsupported 的差异，结论请以 diff JSON 里的 <code>attribution.residual</code> 为准。</div><div class="previews"><div class="preview"><h3>Reference</h3><div class="frame">${ref?`<img src="${ref}" alt="reference">`:'<span class="count">未找到图片</span>'}</div></div><div class="preview"><h3>Actual</h3><div class="frame">${act?`<img src="${act}" alt="actual">`:'<span class="count">未找到图片</span>'}</div></div></div>${ref&&act?`<div class="overlay"><h3>叠加对比（滑块控制 actual 覆盖范围）</h3><div class="overlay-frame"><img src="${ref}" alt="reference overlay"><img src="${act}" alt="actual overlay"></div><input class="range" id="split" type="range" min="0" max="100" value="50"></div>`:''}<div class="json"><h3>差异 JSON</h3><pre>${esc(JSON.stringify(data,null,2))}</pre></div>`;const slider=$('split');if(slider)slider.oninput=()=>document.querySelector('.overlay-frame').style.setProperty('--split',slider.value+'%')}
$('pick').onclick=async()=>{if(!window.showDirectoryPicker){$('folderInput').click();return}try{rootHandle=await showDirectoryPicker({mode:'read'});files.clear();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();await walk(rootHandle);$('root').textContent=`已选择：${rootHandle.name}`;$('refresh').disabled=$('filter').disabled=false;await scan()}catch(e){if(e.name!=='AbortError'){$('root').textContent='目录选择失败，请改用再次点击并选择项目目录';console.error(e)}}};
$('folderInput').onchange=async e=>{files.clear();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();const list=[...e.target.files];for(const f of list){const p=f.webkitRelativePath||f.name;files.set(p,f)}if(list.length){$('root').textContent=`已选择：${list[0].webkitRelativePath?.split('/')[0]||'目录'}`;$('refresh').disabled=$('filter').disabled=false;await scan()}};
$('refresh').onclick=()=>scan();$('filter').oninput=()=>renderList();$('sort').onchange=()=>renderList();
</script></body></html>
